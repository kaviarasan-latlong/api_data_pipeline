# =============================================================================
# latlong_pipeline configuration
# All environment-specific / frequently-changed values live here.
# ${VAR_NAME} entries are resolved from environment variables at load time
# (see config_loader.py) - keep real credentials out of this file / git.
# =============================================================================

database:
  host: "localhost"
  port: 5432
  dbname: "admin_area"
  user: "www-data"
  password: "krishna_g1r1"
  connect_timeout: 10

pipeline:
  name: "api_data_pipeline"
  window_days: 3
  start_date: "2026-08-01T00:00:00+05:30"
  chunk_size: 75000

  included_api_types:
    - /v4/isochrone.json
    - /v4/geofence/contains.json
    - /v4/geocode.json
    - /v4/snap.json
    - /v4/distancematrix.json
    - /v4/pincode.json
    - /v4/reverse_geocode.json
    - /v4/landmarks.json
    - /v4/directions.json
    - /v4/distance.json
    - /v4/geovalidation.json
    - /v4/search.json
    - /v4/trips.json
    - /v4/reverse_geocode_international.json
    - /v4/geo_cipher.json
    - /v4/draw_line.json
    - /v5/search.json
    - /v5/digipin_encode.json
    - /v5/digipin_decode.json
    - /v4/point_of_interest.json
    - /v4.1/brands/:brand_id/stores_around.json
    - /v4.1/brands/:brand_id/find.json
    - /v4.1/brands/:brand_id/search_with_disable.json
    - /v4.1/brands/:brand_id/stores/:customer_store_id/store_details.json

  columns:
    request_logs:
      id: "id"
      requestid: "requestid"
      api_type: "api_type"
      api_version: "api_version"
      bunit_id: "bunit_id"
      tenant_id: "tenant_id"
      path: "path"
      query_string: "query_string"
      created_at: "created_at"
      status: "status"
    response_logs:
      requestid: "requestid"
      data: "data"
      created_at: "created_at"

  latlong_keys:
    request_path_params: ["lat", "lng", "long", "longitude", "latitude"]
    response_json_paths:
      - "data.lat"
      - "data.lng"
      - "data.long"
      - "data.latitude"
      - "data.longitude"
      - "data.geometry.location.lat"
      - "data.geometry.location.lng"

tables:
  request_logs: "logs_aug_2026"
  response_logs: "response_logs_aug_2026"
  session_activities: "session_activities_aug_26"
  watermark_table: "pipeline_watermark"
  output_table: "admin_area_enriched_final"
  geom_table: "aa_geom"
  area_table: "admin_area"

geo_enrichment:
  geom_table_columns:
    a_id: "aa_id"
    geom: "geom"
  area_table_columns:
    a_id: "id"
    parent_id: "aa_in_aa_id"
    display_name: "display_name"
  batch_size: 5000

output:
  report_dir: "/var/www/kaviarasan/api_data_pipeline"
  report_filename_pattern: "api_data_pipeline_report.xlsx"

notifier:
  teams_webhook_url: ""
  template_path: "./notifier_template.json"
