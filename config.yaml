# =============================================================================
# latlong_pipeline configuration
# All environment-specific / frequently-changed values live here.
# ${VAR_NAME} entries are resolved from environment variables at load time
# (see config_loader.py). The Teams webhook can be set directly below.
# =============================================================================

database:
  host: "localhost"
  port: 5432
  dbname: "admin_area"
  user: ""
  password: ""
  connect_timeout: 10

pipeline:
  name: "data_pipeline"
  window_days: 3
  start_date: "2026-08-01T00:00:00+05:30"
  chunk_size: 500000
  parallel_workers: 10

  included_api_types:
    - /v4/isochrone.json
    - /v4/geofence/contains.json
    - /v4/geocode.json
    - /v4/snap.json
    - /v4/distancematrix.json
    - /v4/pincode.json
    - /v4/reverse_geocode.json
    - /v4/landmarks.json
    - /v4/directions.json
    - /v4/distance.json
    - /v4/geovalidation.json
    - /v4/search.json
    - /v4/trips.json
    - /v4/reverse_geocode_international.json
    - /v4/geo_cipher.json
    - /v4/draw_line.json
    - /v5/search.json
    - /v5/digipin_encode.json
    - /v5/digipin_decode.json
    - /v4/point_of_interest.json

  session_only_api_types:
    - /v4.1/brands/:brand_id/stores_around.json
    - /v4.1/brands/:brand_id/find.json
    - /v4.1/brands/:brand_id/search_with_disable.json

  columns:
    request_logs:
      id: "id"
      requestid: "requestid"
      api_type: "api_type"
      api_version: "api_version"
      bunit_id: "bunit_id"
      tenant_id: "tenant_id"
      path: "path"
      query_string: "query_string"
      created_at: "created_at"
      status: "status"
    response_logs:
      requestid: "requestid"
      data: "data"
      created_at: "created_at"
    submissions:
      content: "content"
      survey_id: "survey_id"
      server_created_at: "server_created_at"
    surveys:
      id: "id"
      name: "name"
      bunit_id: "bunit_id"

  latlong_keys:
    request_path_params: ["lat", "lng", "long", "longitude", "latitude"]
    response_json_paths:
      - "data.lat"
      - "data.lng"
      - "data.long"
      - "data.latitude"
      - "data.longitude"
      - "data.geometry.location.lat"
      - "data.geometry.location.lng"

tables:
  request_logs: "logs_aug_2026"
  response_logs: "response_logs_aug_2026"
  session_activities: "session_activities_aug_26"
  submissions: "submissions_aug_2026"
  surveys: "surveys_aug_2026"
  anuga_output_table: "anuga_final"
  watermark_table: "pipeline_watermark"
  output_table: "admin_area_enriched_final"
  geom_table: "aa_geom"
  area_table: "admin_area"

geo_enrichment:
  geom_table_columns:
    a_id: "aa_id"
    geom: "geom"
  area_table_columns:
    a_id: "id"
    parent_id: "aa_in_aa_id"
    display_name: "display_name"
  batch_size: 25000

output:
  report_dir: "/var/www/kaviarasan/data_pipeline"
  monthly_report_folder_pattern: "data_pipeline_report_{month}_{year}"
  monthly_report_filename_pattern: "{report_type}_{month}_{year}.xlsx"
  report_groups:
    automobiles:
      bunit_ids: [301, 540, 582, 273, 602, 370, 514, 577, 601, 406]
      tenant_ids: ["10002385"]
    bfsi:
      bunit_ids: [379,10792]
      tenant_ids: []
    others:
      bunit_ids: [251, 199, 302, 531]
      tenant_ids: ["10001577"]

notifier:
  teams_webhook_url: "https://default844bd70f4af543b2808076b5ce378e.a0.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/24/workflows/75c23c0792134ef599e11e2b75f846a0/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Mtv4B-a9UXW7GCvnz5R2lXfDySk0Foz9S9vUH0AVdhY"
  template_path: "./notifier_template.json"
