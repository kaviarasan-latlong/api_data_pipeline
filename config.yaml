# =============================================================================
# latlong_pipeline configuration
# All environment-specific / frequently-changed values live here.
# ${VAR_NAME} entries are resolved from environment variables at load time
# (see config_loader.py) - keep real credentials out of this file / git.
# =============================================================================

database:
  host: "${DB_HOST}"
  port: 5432
  dbname: "${DB_NAME}"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  # Used for the server-side COPY / batch writes in writer.py
  connect_timeout: 10

pipeline:
  name: "latlong_extraction_pipeline"

  # Rolling window size processed per DAG run.
  window_days: 3

  # Row count pulled from request_logs per extraction loop iteration.
  chunk_size: 75000

  # ---------------------------------------------------------------------
  # API TYPE FILTER
  # ---------------------------------------------------------------------
  # Only rows whose request_logs.api_type is in this list are pulled at all.
  # This is the ONLY place you need to touch when an API is added/retired
  # upstream - no code changes required anywhere else in the pipeline.
  #
  # Include an api_type here ONLY if it can carry lat/long in EITHER:
  #   - the request_logs.path column (query params), or
  #   - the response_logs.data column (response JSON)
  # APIs that never carry lat/long on either side should be left out so we
  # don't pay the cost of pulling/joining rows we'll immediately drop.
  # ---------------------------------------------------------------------
  included_api_types:
    - geocode
    - reverse_geocode
    - autocomplete
    - place_details
    - distance_matrix

  # Column names, in case they differ per-environment.
  columns:
    request_logs:
      id: "id"
      unique_id: "uniqueid"
      created_date: "created_date"
      api_type: "api_type"
      path: "path"
      status: "status"
    response_logs:
      unique_id: "uniqueid"
      data: "data"
      status: "status"

  # Regex / JSON-key hints used by parser.py when pulling lat/long out of
  # the request path (query string) and response JSON body. Extend these
  # if a new api_type uses different key names.
  latlong_keys:
    request_path_params: ["lat", "lng", "long", "longitude", "latitude"]
    response_json_paths:
      - "data.lat"
      - "data.lng"
      - "data.long"
      - "data.latitude"
      - "data.longitude"
      - "data.result.lat"
      - "data.result.lng"
      - "data.geometry.location.lat"
      - "data.geometry.location.lng"

tables:
  request_logs: "request_logs"
  response_logs: "response_logs"
  watermark_table: "pipeline_watermark"
  output_table: "latlong_extracted"
  geom_table: "area_geom"      # polygon geometries, one row per area
  area_table: "area"           # area metadata: a_id, state, district, pincode

geo_enrichment:
  geom_table_columns:
    a_id: "a_id"
    geom: "geom"          # PostGIS geometry/geography column, SRID 4326
  area_table_columns:
    a_id: "a_id"
    state: "state"
    district: "district"
    pincode: "pincode"
  batch_size: 5000  # points per ST_Intersects batch query

output:
  report_dir: "/data/reports/latlong_pipeline"
  # Workbook has 3 sheets: pincode, district, state - each with hit counts.
  # Regenerated (overwritten) after every successful window run.
  report_filename_pattern: "latlong_report_{window_end}.xlsx"

notifier:
  teams_webhook_url: "${TEAMS_WEBHOOK_URL}"
  template_path: "./notifier_template.json"
